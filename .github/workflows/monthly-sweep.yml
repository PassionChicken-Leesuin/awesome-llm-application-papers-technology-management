name: Monthly candidate sweep

on:
  schedule:
    - cron: "17 3 1 * *"   # 1st of each month, 03:17 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  issues: write
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sweep
        id: sweep
        env:
          # OpenAlex polite pool; the noreply address keeps a real inbox out of the repo
          SWEEP_MAILTO: ${{ github.repository_owner }}@users.noreply.github.com
        run: |
          set +e
          python scripts/sweep_candidates.py > candidates.md
          status=$?
          set -e
          echo "count=$(grep -c '^- \[ \]' candidates.md || true)" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # 0 = complete, 3 = ran but some API calls failed (partial); anything else is a hard error
          if [ "$status" != "0" ] && [ "$status" != "3" ]; then exit "$status"; fi

      - name: Open review issue
        if: steps.sweep.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Candidate sweep $(date -u +%Y-%m)"
          if [ "${{ steps.sweep.outputs.status }}" = "3" ]; then title="$title (partial — API failures)"; fi
          gh label create sweep --color BFD4F2 --description "Monthly candidate sweep" || true
          gh issue create \
            --title "$title" \
            --label "sweep" \
            --body-file candidates.md

      - name: Nothing found
        if: steps.sweep.outputs.count == '0' && steps.sweep.outputs.status == '0'
        run: echo "No new candidates this month."

      - name: Fail on partial sweep
        if: steps.sweep.outputs.status == '3'
        run: |
          echo "::error::Sweep was partial — some API requests failed. The review issue (if any) is marked (partial)."
          exit 1
